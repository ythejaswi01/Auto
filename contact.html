<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#062B60">
  <title>Contact Auto Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-page="contact">
  <header class="site-header" id="site-header"></header>
  <main class="page-shell narrow-page">
    <div class="page-intro"><span class="eyebrow">WE'RE HERE TO HELP</span><h1>Get in touch</h1><p>Questions about a service or part? Send our team a message.</p></div>
    <form class="form-card" data-form="contact">
      <label>Your name<input name="name" autocomplete="name" placeholder="Your name" required></label>
      <label>Email address<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
      <label>How can we help?<textarea name="message" rows="5" placeholder="Write your message..." required></textarea></label>
      <button class="button button-primary" type="submit">Send message</button>
    </form>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
